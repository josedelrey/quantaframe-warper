[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "quantaframe-warper"
version = "0.1.0"
description = "Experimental codec motion-vector PNG warping"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["av>=16,<18", "numpy>=2,<3", "Pillow>=12,<14", "opencv-python-headless>=4.12,<5"]

[project.scripts]
quantaframe-warper = "quantaframe_warper.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/quantaframe_warper"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
